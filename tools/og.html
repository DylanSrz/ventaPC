<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla para regenerar og.png (vista previa al compartir). Captura de 1200x630. -->
<link rel="stylesheet" href="../css/styles.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  .og { display: grid; grid-template-columns: 1.35fr .65fr; align-items: center; height: 100%; padding: 0 70px; gap: 20px; }
  .og h1 { font-size: 74px; margin: 10px 0 18px; }
  .og ul { list-style: none; padding: 0; margin: 26px 0 0; display: flex; flex-wrap: wrap; gap: 10px; }
  .og li { font: 600 20px/1 var(--mono); padding: 12px 16px; border: 1px solid var(--line-2); border-radius: 10px; background: rgba(255,255,255,.04); }
  .og p { font-size: 26px; color: var(--muted); margin: 0; }
  .og .tower { width: 230px; animation: none; }
  .eyebrow { font-size: 18px; }
</style></head>
<body>
<div class="bg-grid"></div><div class="bg-glow"></div>
<div class="og">
  <div>
    <p class="eyebrow"><span class="pulse"></span> En venta · Colombia</p>
    <h1>PC Gamer<br><span class="grad"><span class="nw">RTX 4060</span><br><span class="nw">+ i5-12600KF</span></span></h1>
    <p>Setup completo con monitor 165 Hz y kit de streaming</p>
    <ul><li>32 GB DDR5</li><li>SSD 990 PRO 1 TB</li><li>Z690 AORUS</li><li>AIO 240 mm</li><li>750 W Gold</li></ul>
  </div>
  <div class="hero__visual" style="min-height:0">
    <div class="tower">
      <div class="tower__glass">
        <div class="tower__mobo"></div><div class="tower__cooler"><i></i><i></i></div><div class="tower__block"></div>
        <div class="tower__ram"><i></i><i></i></div><div class="tower__gpu"><span>GEFORCE RTX</span><i></i><i></i></div>
        <div class="tower__psu"><span>RM750x</span></div><div class="tower__fans"><i></i><i></i><i></i></div>
      </div><div class="tower__front"></div>
    </div>
  </div>
</div>
</body></html>
